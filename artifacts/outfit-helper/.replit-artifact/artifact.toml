kind = "web"
previewPath = "/"
title = "Outfit Helper"
description = "A unified Next.js application for outfit styling, clothes, shoes, and accounts."
version = "1.0.0"
id = "artifacts/outfit-helper"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api", "/_next/hmr", "/_next/webpack-hmr"]
localPort = 20024

[services.development]
run = "pnpm --filter @workspace/outfit-helper run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/outfit-helper", "run", "build"]
run = ["pnpm", "--filter", "@workspace/outfit-helper", "run", "start"]

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "20024"
BASE_PATH = "/"
